version: 1
applications:
  - frontend:
      buildPath: '/'
      phases:
        preBuild:
          commands:
            - corepack enable
            - echo "node-linker=hoisted" >> ./.npmrc
            - pnpm install --frozen-lockfile --prefer-offline
        build:
          commands:
            - pnpm build --filter=@qseat/web
      artifacts:
        baseDirectory: ./apps/web/.next
        files:
          - '**/*'
      cache:
        paths:
          - ./node_modules/**/*
          - ./apps/web/node_modules/**/*
          - ./apps/web/.next/cache/**/*
    appRoot: apps/web
