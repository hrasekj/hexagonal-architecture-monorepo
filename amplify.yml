version: 1
applications:
  - appRoot: apps/api
    backend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - pnpm install --frozen-lockfile --prefer-offline
        build:
          commands:
            - echo "Let's build the backend $AWS_BRANCH id $AWS_APP_ID"
            - pnpm ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --debug
    frontend:
      phases:
        preBuild:
          commands:
            - echo "No build step – static hosting of index.html"
      artifacts:
        baseDirectory: ./
        files:
          - index.html
      cache:
        paths: []

  - appRoot: apps/web
    frontend:
        buildPath: /
        phases:
          preBuild:
            commands:
              - corepack enable
              - pnpm config set node-linker hoisted
              - pnpm install --frozen-lockfile --prefer-offline
              - echo "Let's build the frontend $AWS_BRANCH id $AWS_APP_ID on $AWS_REGION and $AWS_STACK_NAME ($BACKEND_STACK_NAME) and $BACKEND_APP_ID"
              - pnpm ampx generate outputs --stack $BACKEND_STACK_NAME --debug
          build:
            commands:
              - pnpm build --filter=@qseat/web
              - du -csh *
        artifacts:
          baseDirectory: ./apps/web/.next
          files:
            - '**/*'
        cache:
          paths:
            - ./node_modules/**/*
            - ./apps/web/node_modules/**/*
            - ./apps/web/.next/cache/**/*
