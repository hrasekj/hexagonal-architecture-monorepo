version: 1
applications:
  - appRoot: apps/web
    backend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - pnpm config set node-linker hoisted
            - pnpm install --frozen-lockfile --prefer-offline
        build:
          commands:
            - echo "Let's build the backend $AWS_BRANCH id $AWS_APP_ID"
            - pnpm deploy --filter=@qseat/api

    frontend:
        buildPath: /
        phases:
          preBuild:
            commands:
              - pwd
              - echo "Let's build the frontend $AWS_BRANCH id $AWS_APP_ID"
          build:
            commands:
              - pnpm build --filter=@qseat/web
              - du -csh *
        artifacts:
          baseDirectory: ./apps/web/.next
          files:
            - '**/*'
        cache:
          paths:
            - ./node_modules/**/*
            - ./apps/web/node_modules/**/*
            - ./apps/web/.next/cache/**/*
