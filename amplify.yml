version: 1
applications:
  - appRoot: apps/api
    backend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - pnpm install --frozen-lockfile --prefer-offline
        build:
          commands:
            - echo "Let's build the backend $AWS_BRANCH id $AWS_APP_ID"
            - pnpm ampx pipeline-deploy --debug --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - echo "No build step – static hosting of index.html"
      artifacts:
        baseDirectory: ./
        files:
          - index.html
      case:
        paths: []
