version: 1
applications:
  - appRoot: apps/web
    backend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - pnpm config set node-linker hoisted
            - pnpm install --frozen-lockfile --prefer-offline
            - cd apps/api
        build:
          commands:
            - echo "Let's build the backend $AWS_BRANCH id $AWS_APP_ID"
            - pnpm ampx pipeline-deploy --outputs-out-dir ../../ --branch $AWS_BRANCH --app-id $AWS_APP_ID --debug

    frontend:
        buildPath: /
        phases:
          preBuild:
            commands:
              - pwd
              - corepack enable
              - pnpm install --frozen-lockfile --prefer-offline
          build:
            commands:
              - pnpm build --filter=@qseat/web
              - du -csh *
        artifacts:
          baseDirectory: ./apps/web/.next
          files:
            - '**/*'
        cache:
          paths:
            - ./node_modules/**/*
            - ./apps/web/node_modules/**/*
            - ./apps/web/.next/cache/**/*
