version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - pnpm install --frozen-lockfile --prefer-offline
        build:
          commands:
            - ./node_modules/.bin/next build
      artifacts:
        baseDirectory: ./
        files:
          - '**/*'
      cache:
        paths:
          - ./node_modules/**/*
          - ./.next/cache/**/*
    appRoot: apps/web
